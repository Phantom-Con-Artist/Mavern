<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Mavern</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: light dark; --bg: #ebe8e1; --panel: #fcfbf8; --ink: #1b1a17; --soft: #57544c; --accent: #2e5a40; }
      @media (prefers-color-scheme: dark) { :root { --bg: #100f0d; --panel: #201e1a; --ink: #ece7da; --soft: #aaa496; --accent: #9cc08e; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 32rem; padding: 2.5rem; background: var(--panel); border: 2px solid var(--ink); box-shadow: 8px 8px 0 var(--accent); }
      h1 { margin: 0 0 .5rem; font-size: 1.75rem; line-height: 1.1; }
      p { margin: 0 0 1.5rem; color: var(--soft); }
      a { color: var(--ink); font-weight: 700; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address. It may have moved.</p>
      <a href="/">Go to the Mavern home page</a>
    </main>
  </body>
</html>
