<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6f93bd" />
  <title>Mavern — Valley specimen 05</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: "DM Sans"; src: url("../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "DM Sans"; src: url("../../node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: swap; }

    :root {
      --night: #1d2b3a;
      --cream: #f6f0e1;
      --cream-soft: rgba(246, 240, 225, .86);
      --gold: #f2d99a;
      --ink: #26323a;
      --serif: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--night); color: var(--cream); font: 400 16px/1.6 var(--sans); overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    .hero { position: relative; min-height: 100svh; overflow: hidden; isolation: isolate; background: #a9c4dc; }

    /* ---- drawn layers (back to front). Each .layer gets parallax from JS; the svg inside keeps its own animation. ---- */
    .layer { position: absolute; inset: 0; will-change: transform; transform: scale(1.07); }
    svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }

    .clouds svg { animation: cloudDrift 140s linear infinite alternate; }
    @keyframes cloudDrift { from { transform: translateX(-3%); } to { transform: translateX(4%); } }

    .mist-a { animation: drift 60s ease-in-out infinite alternate; }
    .mist-b { animation: drift 84s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translateX(-70px); } to { transform: translateX(90px); } }

    .rays { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .7;
      background: conic-gradient(from 150deg at 32% 32%, transparent 0 6deg, rgba(255, 240, 196, .34) 12deg, transparent 20deg, rgba(255, 240, 196, .24) 28deg, transparent 38deg, rgba(255, 240, 196, .3) 46deg, transparent 58deg);
      filter: blur(8px); animation: rays 15s ease-in-out infinite alternate; }
    @keyframes rays { from { opacity: .35; } to { opacity: .9; } }

    .grass svg { transform-origin: 50% 100%; animation: sway 7s steps(14) infinite alternate; }
    @keyframes sway { from { transform: skewX(-.9deg); } to { transform: skewX(1.1deg); } }
    .canopy svg { transform-origin: 78% 90%; animation: canopySway 16s ease-in-out infinite alternate; }
    @keyframes canopySway { from { transform: rotate(-.35deg) translateY(0); } to { transform: rotate(.4deg) translateY(-3px); } }
    .near svg { transform-origin: 50% 100%; animation: sway 9s ease-in-out infinite alternate-reverse; }

    .hair { transform-box: fill-box; transform-origin: 50% 0; animation: hem 9s steps(18) infinite alternate-reverse; }
    .cloak-hem { transform-box: fill-box; transform-origin: 50% 0; animation: hem 7s steps(14) infinite alternate; }
    @keyframes hem { from { transform: skewX(-4deg); } to { transform: skewX(5deg); } }

    #sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

    .vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; background:
      radial-gradient(120% 90% at 62% 40%, transparent 50%, rgba(18, 28, 40, .45) 100%),
      linear-gradient(180deg, rgba(18, 28, 40, .3), transparent 20%, transparent 50%, rgba(18, 28, 40, .7)); }
    .paper { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: .2; mix-blend-mode: soft-light; }

    /* ---- content ---- */
    header.top { position: absolute; z-index: 6; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 22px 20px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font: 500 17px/1 var(--sans); letter-spacing: -.02em; text-shadow: 0 1px 14px rgba(12, 20, 32, .6); }
    .seal { width: 40px; height: 40px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(246, 240, 225, .3), 0 6px 24px rgba(10, 18, 28, .35); filter: url(#wobble); }
    .seal img { width: 30px; height: 30px; object-fit: contain; }
    nav.links { display: flex; gap: 22px; font-size: 14px; color: var(--cream-soft); text-shadow: 0 1px 12px rgba(12, 20, 32, .7); }
    nav.links a { padding: 8px 2px; border-bottom: 1px solid transparent; transition: border-color .4s; }
    nav.links a:hover, nav.links a:focus-visible { border-color: var(--gold); outline: none; }

    .copy { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 0 20px max(44px, 7svh); max-width: 720px; }
    .kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; text-shadow: 0 1px 12px rgba(12, 20, 32, .8); }
    h1 { font: 400 clamp(4.2rem, 17vw, 9.5rem)/.88 var(--serif); letter-spacing: -.02em; margin: 0; text-shadow: 0 2px 40px rgba(12, 20, 32, .55); filter: url(#wobble); }
    h1 em { font-style: italic; color: var(--gold); }
    .lede { font: 400 clamp(1.15rem, 3.6vw, 1.5rem)/1.45 var(--serif); max-width: 30ch; margin: 22px 0 0; text-shadow: 0 1px 18px rgba(12, 20, 32, .75); }
    .lede-sub { margin: 10px 0 0; max-width: 40ch; font-size: 14px; color: var(--cream-soft); text-shadow: 0 1px 14px rgba(12, 20, 32, .85); }
    .cta { display: inline-flex; align-items: center; margin-top: 30px; padding: 15px 28px; font-weight: 500; font-size: 15px; color: var(--ink); background: var(--cream); border-radius: 999px; transition: transform .5s ease, box-shadow .5s ease; box-shadow: 0 10px 40px -10px rgba(255, 230, 170, .5); filter: url(#wobble); }
    .cta:hover { transform: translateY(-3px); box-shadow: 0 16px 50px -8px rgba(255, 230, 170, .7); }
    .cta:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

    .fade { opacity: 0; transform: translateY(14px); animation: arrive 2.4s cubic-bezier(.2, .6, .2, 1) forwards; }
    .fade.d1 { animation-delay: .5s; } .fade.d2 { animation-delay: 1.1s; } .fade.d3 { animation-delay: 1.7s; } .fade.d4 { animation-delay: 2.2s; }
    @keyframes arrive { to { opacity: 1; transform: none; } }
    .veil { position: absolute; inset: 0; z-index: 8; background: var(--night); pointer-events: none; animation: lift 3.2s ease-out .1s forwards; }
    @keyframes lift { to { opacity: 0; visibility: hidden; } }

    @media (max-width: 759px) {
      .vignette { background: linear-gradient(180deg, rgba(18, 28, 40, .4), transparent 20%, rgba(18, 28, 40, .3) 45%, rgba(18, 28, 40, .85) 100%); }
    }
    @media (min-width: 760px) {
      header.top { padding: 30px 48px; }
      .copy { padding-left: 48px; padding-bottom: 9svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      .clouds svg, .mist-a, .mist-b, .rays, .grass svg, .canopy svg, .near svg, .hair, .cloak-hem { animation: none; }
      .fade { animation: none; opacity: 1; transform: none; }
      .veil { display: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence id="wobble-noise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" />
        <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0" />
      </filter>
    </defs>
  </svg>

  <main class="hero">
    <div class="veil" aria-hidden="true"></div>

    <!-- The scene is decorative; every layer is drawn by assets/scene-5.js -->
    <div aria-hidden="true">
      <div class="layer" data-depth="3"><svg class="scene" id="sky-art" preserveAspectRatio="none"></svg></div>
      <div class="layer clouds" data-depth="6"><svg class="scene" id="clouds" preserveAspectRatio="none"></svg></div>
      <div class="rays"></div>
      <div class="layer" data-depth="10"><svg class="scene" id="mountains" preserveAspectRatio="none"></svg></div>
      <div class="layer" data-depth="14"><svg class="scene" id="mist" preserveAspectRatio="none"></svg></div>
      <div class="layer" data-depth="20"><svg class="scene" id="valley" preserveAspectRatio="none"></svg></div>
      <div class="layer" data-depth="30"><svg class="scene" id="foreground" preserveAspectRatio="none"></svg></div>
      <div class="layer" data-depth="30"><svg class="scene" id="traveller" preserveAspectRatio="none"></svg></div>
      <div class="layer grass" data-depth="34"><svg class="scene" id="grass" preserveAspectRatio="none"></svg></div>
      <div class="layer" data-depth="36"><svg class="scene" id="trunk" preserveAspectRatio="none"></svg></div>
      <div class="layer canopy" data-depth="42"><svg class="scene" id="canopy" preserveAspectRatio="none"></svg></div>
      <div class="layer near" data-depth="70"><svg class="scene" id="near" preserveAspectRatio="none"></svg></div>
    </div>

    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <svg class="paper" aria-hidden="true" width="100%" height="100%"><rect width="100%" height="100%" filter="url(#grain)" /></svg>

    <header class="top">
      <a class="brand fade d1" href="#" aria-label="Mavern home">
        <span class="seal"><img src="../../assets/mavern-logo.png" alt="" /></span>
        <span>mavern</span>
      </a>
      <nav class="links fade d1" aria-label="Main navigation">
        <a href="#about">About</a>
        <a href="mailto:hello@mavern.in">Contact</a>
      </nav>
    </header>

    <div class="copy">
      <p class="kicker fade d1">An independent creative practice</p>
      <h1 class="fade d2">Mav<em>ern</em></h1>
      <p class="lede fade d3">Development, art, music, writing, and experiments. Creativity is the objective.</p>
      <p class="lede-sub fade d3">The work is still being gathered here. Check back, or say hello.</p>
      <a class="cta fade d4" href="mailto:hello@mavern.in">Get in touch</a>
    </div>
  </main>

  <script src="./assets/scene-5.js"></script>
  <script src="./assets/atmosphere-5.js"></script>
</body>
</html>
